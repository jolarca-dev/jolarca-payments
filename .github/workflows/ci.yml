# CI workflow for jolarca-payments
# Produces the two required status checks declared in
# repos/jolarca-payments.yml: `ci` and `security`.
#
# This is a policy/governance repository (no application code), so the `ci`
# job validates documents and runs the test suite. The `security` job runs
# gitleaks to ensure no secrets enter the CDE repository.
#
# gitleaks is invoked as the upstream CLI, not `gitleaks/gitleaks-action@v2`.
# The action demands a paid `GITLEAKS_LICENSE` secret for organization-owned
# repositories and fails closed without it, which took the `security` context
# red on `main`. The CLI is open source, needs no license, and is the pattern
# already proven green in `jolarca-data` and `jolarca`.
#
# The nightly schedule is periodic re-attestation of the secret-scanning
# control (PCI-DSS Req. 11). It does NOT pick up newer gitleaks rules, because
# GL_VER is pinned on purpose; note also that GitHub auto-disables scheduled
# workflows in public repositories after 60 days without activity, so the
# presence of a recent green scheduled run is itself the evidence to monitor.
# Only `security` runs on schedule — the `ci` job is gated off below.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"   # nightly full-history secret scan

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # The schedule exists for the secret scan only. This job installs its
    # toolchain unpinned, so running it nightly would let an upstream release
    # turn a required check red on main with no change to this repository.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff mypy pytest

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy --strict .

      - name: Pytest
        run: pytest tests/ -q

      - name: YAML validation
        run: |
          pip install yamllint
          yamllint -d "{extends: default, rules: {line-length: disable}}" .

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 is required: the default shallow checkout exposes only the
      # tip commit, so a secret in an earlier commit would never be scanned.
      # Pinned to a full commit SHA, never a tag, per
      # jolarca-control/CONTRIBUTING.md (supply-chain control T-12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks secret scan (full history)
        shell: bash
        run: |
          set -euo pipefail
          # Fleet-standard version (jolarca, jolarca-data, jolarca-legal,
          # jolarca-compliance, jolarca-infrastructure). Bump fleet-wide via
          # jolarca-control, not here — divergent scanner rules would make the
          # same content pass in one CDE repo and fail in another.
          GL_VER=8.21.2
          GL_TGZ="gitleaks_${GL_VER}_linux_x64.tar.gz"
          GL_BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}"
          curl -fsSL "${GL_BASE}/${GL_TGZ}" -o "${GL_TGZ}"
          curl -fsSL "${GL_BASE}/gitleaks_${GL_VER}_checksums.txt" -o checksums.txt
          # Verify the artifact against upstream's published digest before it is
          # installed and run against the full history of a CDE repository.
          grep -F "${GL_TGZ}" checksums.txt | sha256sum -c -
          tar xzf "${GL_TGZ}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
          gitleaks detect --source . --no-banner --redact
