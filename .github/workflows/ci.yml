# CI workflow for jolarca-payments
# Produces the two required status checks declared in
# repos/jolarca-payments.yml: `ci` and `security`.
#
# This is a policy/governance repository (no application code), so the `ci`
# job validates documents and runs the test suite. The `security` job runs
# gitleaks to ensure no secrets enter the CDE repository.
#
# gitleaks is invoked as the upstream CLI, not `gitleaks/gitleaks-action@v2`.
# The action demands a paid `GITLEAKS_LICENSE` secret for organization-owned
# repositories and fails closed without it, which took the `security` context
# red on `main`. The CLI is open source, needs no license, and is the pattern
# already proven green in `jolarca-data` and `jolarca`.
#
# The nightly schedule re-scans full history so that rule updates in a newer
# gitleaks release, or a history rewrite, cannot hide a secret indefinitely
# (PCI-DSS Req. 11 — periodic security testing).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"   # nightly full-history secret scan

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff mypy pytest

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy --strict .

      - name: Pytest
        run: pytest tests/ -q

      - name: YAML validation
        run: |
          pip install yamllint
          yamllint -d "{extends: default, rules: {line-length: disable}}" .

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 is required: the default shallow checkout exposes only the
      # tip commit, so a secret in an earlier commit would never be scanned.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks secret scan (full history)
        run: |
          GL_VER=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
          gitleaks detect --source . --no-banner --redact
